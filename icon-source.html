<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0; padding: 0;
    width: 512px; height: 512px;
    background: #1a1a2e;
  }
  .icon {
    width: 512px; height: 512px;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  svg.ring {
    position: absolute;
    inset: 0;
    width: 512px;
    height: 512px;
  }
  .ball { font-size: 210px; line-height: 1; z-index: 1; margin-top: -10px; }
  .label {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 60px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #4ade80;
    margin-top: 8px;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="icon">
    <svg class="ring" viewBox="0 0 512 512">
      <circle cx="256" cy="256" r="242" fill="none" stroke="#4ade80" stroke-width="28"/>
    </svg>
    <div class="ball">⚽</div>
    <div class="label">RefClock</div>
  </div>
</body>
</html>
