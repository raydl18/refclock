<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>RefClock</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
    }

    /* ─── SETUP SCREEN ─────────────────────────────── */
    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      height: 100dvh;
      padding: 24px;
      background: #1a1a2e;
    }

    #setup-screen h1 {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 5px;
      color: #4ade80;
    }

    .setup-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 360px;
    }

    .team-setup {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #16213e;
      border-radius: 14px;
      padding: 12px 16px;
    }

    .team-color-swatch {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.2);
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
    }

    .team-color-swatch input[type="color"] {
      position: absolute;
      inset: -8px;
      width: calc(100% + 16px);
      height: calc(100% + 16px);
      opacity: 0;
      cursor: pointer;
    }

    .team-name-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 4px 0;
      outline: none;
    }

    .team-name-input:focus {
      border-bottom-color: #4ade80;
    }

    .duration-setup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .duration-setup label {
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
    }

    .time-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-inputs input {
      width: 68px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      padding: 8px 4px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 10px;
      color: #fff;
      outline: none;
    }

    .time-inputs input:focus { border-color: #4ade80; }
    .time-inputs span { font-size: 1.8rem; font-weight: 700; color: #aaa; }

    #btn-start-game {
      width: 100%;
      max-width: 360px;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: #4ade80;
      color: #1a1a2e;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    #btn-start-game:active { transform: scale(0.97); background: #22c55e; }

    /* ─── GAME SCREEN ──────────────────────────────── */
    #game-screen {
      display: none;
      height: 100dvh;
      width: 100%;
      flex-direction: row;
    }

    #game-screen.active { display: flex; }

    /* Team panels */
    .team-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 6px 10px 6px;
      gap: 6px;
      overflow: hidden;
      position: relative;
      transition: background 0.3s;
    }

    .team-panel .team-label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.85;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-panel .score {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1;
    }

    /* Event log on each side */
    .events-log {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: none;
    }
    .events-log::-webkit-scrollbar { display: none; }

    .event-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 0.7rem;
      font-weight: 700;
      opacity: 0.9;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
      padding: 4px 5px;
    }

    .event-icon { font-size: 0.9rem; flex-shrink: 0; }
    .event-detail { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-time { font-size: 0.6rem; opacity: 0.7; flex-shrink: 0; }

    /* Team action buttons */
    .team-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .action-btn {
      width: 100%;
      padding: 10px 4px;
      border: none;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      background: rgba(0,0,0,0.3);
      color: inherit;
      transition: background 0.1s, transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .action-btn .action-icon { font-size: 1.3rem; }
    .action-btn:active { transform: scale(0.95); background: rgba(0,0,0,0.5); }

    /* ─── CENTER PANEL ─────────────────────────────── */
    #center-panel {
      width: 108px;
      flex-shrink: 0;
      background: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 6px;
      box-shadow: 0 0 24px rgba(0,0,0,0.7);
      z-index: 2;
    }

    #center-panel .app-title {
      font-size: 0.55rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #4ade80;
      text-transform: uppercase;
    }

    #clock {
      font-size: 1.7rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: #4ade80;
      transition: color 0.3s;
      text-align: center;
    }

    #clock.warning { color: #facc15; }
    #clock.danger  { color: #f87171; animation: pulse 0.8s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    #period-label {
      font-size: 0.6rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #666;
      text-align: center;
    }

    #status-label {
      font-size: 0.6rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #888;
      text-align: center;
    }

    .center-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ctrl-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    .ctrl-btn:active { transform: scale(0.9); }
    .ctrl-btn:disabled { opacity: 0.3; pointer-events: none; }

    #btn-play { background: #16a34a; color: #fff; }
    #btn-pause { background: #dc2626; color: #fff; }

    #btn-end-game {
      width: 100%;
      padding: 10px 4px;
      border: none;
      border-radius: 10px;
      background: #7c3aed;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    #btn-end-game:active { transform: scale(0.96); background: #6d28d9; }

    /* ─── MODAL ────────────────────────────────────── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #modal-overlay.show { display: flex; }

    #modal {
      background: #1e293b;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }

    #modal h2 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
    }

    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-field label {
      font-size: 0.75rem;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .modal-field input {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 10px 14px;
      outline: none;
      text-align: center;
    }

    .modal-field input:focus { border-color: #4ade80; }

    /* Card type selector */
    .card-type-row {
      display: flex;
      gap: 10px;
    }

    .card-type-btn {
      flex: 1;
      padding: 14px;
      border: 3px solid transparent;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: border-color 0.15s, transform 0.1s;
    }

    .card-type-btn .card-icon { font-size: 1.6rem; }
    .card-type-btn.yellow-card { background: rgba(234,179,8,0.15); color: #facc15; }
    .card-type-btn.red-card    { background: rgba(239,68,68,0.15);  color: #f87171; }
    .card-type-btn.selected    { border-color: currentColor; }
    .card-type-btn:active      { transform: scale(0.96); }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .modal-btn:active { transform: scale(0.96); }

    #modal-cancel { background: #334155; color: #ccc; }
    #modal-confirm { background: #4ade80; color: #1a1a2e; }

    /* ─── END GAME OVERLAY ─────────────────────────── */
    #endgame-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 30;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
      gap: 20px;
      align-items: center;
    }
    #endgame-overlay.show { display: flex; }

    #endgame-overlay h2 {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #f87171;
      text-align: center;
      margin-top: 8px;
    }

    .final-scoreboard {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      overflow: hidden;
    }

    .final-team {
      flex: 1;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .final-team .final-team-name {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .final-team .final-score {
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1;
    }

    .final-vs {
      font-size: 1rem;
      font-weight: 900;
      color: #666;
      padding: 0 8px;
      background: #1a1a2e;
      align-self: stretch;
      display: flex;
      align-items: center;
    }

    .stats-section {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stats-section h3 {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
    }

    .stats-row {
      display: flex;
      gap: 10px;
    }

    .stats-team-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stats-team-col .col-header {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
      text-align: center;
    }

    .stats-event-item {
      font-size: 0.75rem;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-event-item .s-icon { font-size: 1rem; }
    .stats-event-item .s-detail { flex: 1; font-weight: 600; }
    .stats-event-item .s-time { font-size: 0.65rem; color: #888; }

    .no-events { font-size: 0.75rem; color: #555; text-align: center; padding: 8px; }

    #btn-new-game {
      width: 100%;
      max-width: 380px;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: #4ade80;
      color: #1a1a2e;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 8px;
      margin-bottom: 16px;
    }
    #btn-new-game:active { opacity: 0.85; }
  </style>
</head>
<body>

<!-- ═══════════════ SETUP SCREEN ═══════════════ -->
<div id="setup-screen">
  <h1>RefClock</h1>

  <div class="setup-row">
    <!-- Team A -->
    <div class="team-setup">
      <div class="team-color-swatch" id="swatch-a" style="background:#1d4ed8;">
        <input type="color" id="color-a" value="#1d4ed8" />
      </div>
      <input class="team-name-input" id="name-a" type="text" placeholder="Team A" maxlength="16" value="Home" />
    </div>

    <!-- Team B -->
    <div class="team-setup">
      <div class="team-color-swatch" id="swatch-b" style="background:#dc2626;">
        <input type="color" id="color-b" value="#dc2626" />
      </div>
      <input class="team-name-input" id="name-b" type="text" placeholder="Team B" maxlength="16" value="Away" />
    </div>

    <!-- Duration -->
    <div class="duration-setup">
      <label>Game Duration</label>
      <div class="time-inputs">
        <input type="number" id="input-min" value="45" min="1" max="99" />
        <span>:</span>
        <input type="number" id="input-sec" value="00" min="0" max="59" />
      </div>
    </div>
  </div>

  <button id="btn-start-game">Kick Off</button>
</div>

<!-- ═══════════════ GAME SCREEN ════════════════ -->
<div id="game-screen">

  <!-- LEFT TEAM -->
  <div class="team-panel" id="panel-a">
    <div class="team-label" id="label-a">Home</div>
    <div class="score" id="score-a">0</div>
    <div class="events-log" id="log-a"></div>
    <div class="team-actions">
      <button class="action-btn" id="goal-a">
        <span class="action-icon">⚽</span>Goal
      </button>
      <button class="action-btn" id="card-a">
        <span class="action-icon">🟨</span>Card
      </button>
    </div>
  </div>

  <!-- CENTER -->
  <div id="center-panel">
    <div class="app-title">RefClock</div>
    <div>
      <div id="clock">--:--</div>
      <div id="period-label">1st Half</div>
    </div>
    <div id="status-label">Ready</div>
    <div class="center-controls">
      <button class="ctrl-btn" id="btn-play">▶</button>
      <button class="ctrl-btn" id="btn-pause" disabled>⏸</button>
    </div>
    <button id="btn-end-game">End Game</button>
  </div>

  <!-- RIGHT TEAM -->
  <div class="team-panel" id="panel-b">
    <div class="team-label" id="label-b">Away</div>
    <div class="score" id="score-b">0</div>
    <div class="events-log" id="log-b"></div>
    <div class="team-actions">
      <button class="action-btn" id="goal-b">
        <span class="action-icon">⚽</span>Goal
      </button>
      <button class="action-btn" id="card-b">
        <span class="action-icon">🟨</span>Card
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════ EVENT MODAL ════════════════ -->
<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">Goal</h2>

    <div class="modal-field">
      <label>Player # <span style="color:#555">(optional)</span></label>
      <input type="number" id="modal-player" placeholder="—" min="1" max="99" />
    </div>

    <!-- Card type (shown only for card events) -->
    <div class="modal-field" id="card-type-field">
      <label>Card Type</label>
      <div class="card-type-row">
        <button class="card-type-btn yellow-card selected" id="btn-yellow">
          <span class="card-icon">🟨</span>Yellow
        </button>
        <button class="card-type-btn red-card" id="btn-red">
          <span class="card-icon">🟥</span>Red
        </button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="modal-btn" id="modal-cancel">Cancel</button>
      <button class="modal-btn" id="modal-confirm">Add</button>
    </div>
  </div>
</div>

<!-- ═══════════════ END GAME OVERLAY ══════════ -->
<div id="endgame-overlay">
  <h2>Final Whistle</h2>

  <div class="final-scoreboard" id="final-scoreboard"></div>

  <div class="stats-section">
    <h3>Match Events</h3>
    <div class="stats-row" id="stats-row"></div>
  </div>

  <button id="btn-new-game">New Game</button>
</div>

<script>
  /* ── State ───────────────────────────────── */
  const state = {
    teams: [
      { name: 'Home', color: '#1d4ed8', score: 0 },
      { name: 'Away', color: '#dc2626', score: 0 }
    ],
    events: [],          // { team, type, player, cardType, timestamp, elapsed }
    totalSeconds: 2700,
    remaining: 2700,
    running: false,
    intervalId: null,
    elapsedSeconds: 0,
  };

  /* ── Helpers ─────────────────────────────── */
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(s) { return `${pad(Math.floor(s/60))}:${pad(s%60)}`; }

  function textColor(hex) {
    const r = parseInt(hex.slice(1,3),16),
          g = parseInt(hex.slice(3,5),16),
          b = parseInt(hex.slice(5,7),16);
    return (0.299*r + 0.587*g + 0.114*b)/255 > 0.45 ? '#111' : '#fff';
  }

  function elapsedLabel() {
    const e = state.elapsedSeconds;
    return `${pad(Math.floor(e/60))}'`;
  }

  /* ── DOM refs ────────────────────────────── */
  const $ = id => document.getElementById(id);
  const setupScreen    = $('setup-screen');
  const gameScreen     = $('game-screen');
  const clockEl        = $('clock');
  const statusEl       = $('status-label');
  const periodEl       = $('period-label');
  const btnPlay        = $('btn-play');
  const btnPause       = $('btn-pause');
  const btnEndGame     = $('btn-end-game');
  const modalOverlay   = $('modal-overlay');
  const modalTitle     = $('modal-title');
  const modalPlayer    = $('modal-player');
  const cardTypeField  = $('card-type-field');
  const btnYellow      = $('btn-yellow');
  const btnRed         = $('btn-red');
  const modalCancel    = $('modal-cancel');
  const modalConfirm   = $('modal-confirm');
  const endgameOverlay = $('endgame-overlay');
  const btnNewGame     = $('btn-new-game');

  /* ── Setup screen wiring ─────────────────── */
  const colorA = $('color-a'), colorB = $('color-b');
  const swatchA = $('swatch-a'), swatchB = $('swatch-b');

  colorA.addEventListener('input', () => swatchA.style.background = colorA.value);
  colorB.addEventListener('input', () => swatchB.style.background = colorB.value);

  $('btn-start-game').addEventListener('click', () => {
    const mins = Math.max(1, parseInt($('input-min').value)||45);
    const secs = Math.min(59, Math.max(0, parseInt($('input-sec').value)||0));
    state.totalSeconds = mins*60 + secs;
    state.remaining    = state.totalSeconds;
    state.elapsedSeconds = 0;

    state.teams[0].name  = $('name-a').value.trim() || 'Home';
    state.teams[0].color = colorA.value;
    state.teams[1].name  = $('name-b').value.trim() || 'Away';
    state.teams[1].color = colorB.value;

    state.teams[0].score = 0;
    state.teams[1].score = 0;
    state.events = [];

    applyTeamColors();
    renderScores();
    $('log-a').innerHTML = '';
    $('log-b').innerHTML = '';
    clockEl.textContent = fmt(state.remaining);
    statusEl.textContent = 'Ready';
    periodEl.textContent = '1st Half';
    clockEl.className = '';
    btnPlay.disabled  = false;
    btnPause.disabled = true;

    setupScreen.style.display = 'none';
    gameScreen.classList.add('active');
  });

  function applyTeamColors() {
    const [a, b] = state.teams;
    const pa = $('panel-a'), pb = $('panel-b');
    pa.style.background = a.color;
    pb.style.background = b.color;
    const tcA = textColor(a.color), tcB = textColor(b.color);
    pa.style.color = tcA;
    pb.style.color = tcB;
    $('label-a').textContent = a.name;
    $('label-b').textContent = b.name;
    // action btn text inherits color
    pa.querySelectorAll('.action-btn').forEach(b => b.style.color = tcA);
    pb.querySelectorAll('.action-btn').forEach(b => b.style.color = tcB);
  }

  /* ── Timer ───────────────────────────────── */
  function startTimer() {
    if (state.running || state.remaining <= 0) return;
    state.running = true;
    statusEl.textContent = 'Running';
    btnPlay.disabled  = true;
    btnPause.disabled = false;

    state.intervalId = setInterval(() => {
      state.remaining--;
      state.elapsedSeconds++;
      clockEl.textContent = fmt(state.remaining);
      updateClockColor();

      // Period label
      const halfPt = state.totalSeconds / 2;
      periodEl.textContent = state.elapsedSeconds <= halfPt ? '1st Half' : '2nd Half';

      if (state.remaining <= 0) {
        clearInterval(state.intervalId);
        state.running = false;
        statusEl.textContent = "Full Time";
        btnPlay.disabled  = true;
        btnPause.disabled = true;
        clockEl.classList.add('danger');
      }
    }, 1000);
  }

  function pauseTimer() {
    if (!state.running) return;
    clearInterval(state.intervalId);
    state.running = false;
    statusEl.textContent = 'Paused';
    btnPlay.disabled  = false;
    btnPause.disabled = true;
  }

  function updateClockColor() {
    const pct = state.remaining / state.totalSeconds;
    clockEl.classList.remove('warning','danger');
    if (pct <= 0.1)       clockEl.classList.add('danger');
    else if (pct <= 0.25) clockEl.classList.add('warning');
  }

  btnPlay.addEventListener('click', startTimer);
  btnPause.addEventListener('click', pauseTimer);
  btnEndGame.addEventListener('click', showEndGame);

  /* ── Modal ───────────────────────────────── */
  let pendingEvent = null; // { team: 0|1, type: 'goal'|'card' }
  let selectedCard = 'yellow';

  function openModal(team, type) {
    pendingEvent = { team, type };
    modalPlayer.value = '';
    modalTitle.textContent = `${type === 'goal' ? '⚽ Goal' : '🟨 Card'} — ${state.teams[team].name}`;
    cardTypeField.style.display = type === 'card' ? '' : 'none';
    selectedCard = 'yellow';
    btnYellow.classList.add('selected');
    btnRed.classList.remove('selected');
    modalOverlay.classList.add('show');
    setTimeout(() => modalPlayer.focus(), 100);
  }

  function closeModal() {
    modalOverlay.classList.remove('show');
    pendingEvent = null;
  }

  btnYellow.addEventListener('click', () => {
    selectedCard = 'yellow';
    btnYellow.classList.add('selected');
    btnRed.classList.remove('selected');
  });

  btnRed.addEventListener('click', () => {
    selectedCard = 'red';
    btnRed.classList.add('selected');
    btnYellow.classList.remove('selected');
  });

  modalCancel.addEventListener('click', closeModal);

  modalConfirm.addEventListener('click', () => {
    if (!pendingEvent) return;
    const { team, type } = pendingEvent;
    const player = modalPlayer.value.trim() || null;
    const cardType = type === 'card' ? selectedCard : null;

    const event = {
      team,
      type,
      player,
      cardType,
      elapsed: state.elapsedSeconds,
      timestamp: elapsedLabel(),
    };

    state.events.push(event);
    if (type === 'goal') {
      state.teams[team].score++;
      renderScores();
    }
    addEventToLog(team, event);
    closeModal();
  });

  // Close modal on backdrop click
  modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) closeModal();
  });

  // Team buttons
  $('goal-a').addEventListener('click', () => openModal(0, 'goal'));
  $('card-a').addEventListener('click', () => openModal(0, 'card'));
  $('goal-b').addEventListener('click', () => openModal(1, 'goal'));
  $('card-b').addEventListener('click', () => openModal(1, 'card'));

  /* ── Event log rendering ─────────────────── */
  function eventIcon(ev) {
    if (ev.type === 'goal') return '⚽';
    return ev.cardType === 'red' ? '🟥' : '🟨';
  }

  function eventLabel(ev) {
    let label = '';
    if (ev.player) label += `#${ev.player}`;
    if (ev.type === 'card') label += ev.player ? ` ${ev.cardType}` : ev.cardType;
    return label || (ev.type === 'goal' ? 'Goal' : ev.cardType + ' card');
  }

  function addEventToLog(team, ev) {
    const log = team === 0 ? $('log-a') : $('log-b');
    const item = document.createElement('div');
    item.className = 'event-item';
    item.innerHTML = `
      <span class="event-icon">${eventIcon(ev)}</span>
      <span class="event-detail">${eventLabel(ev)}</span>
      <span class="event-time">${ev.timestamp}</span>
    `;
    log.appendChild(item);
    log.scrollTop = log.scrollHeight;
  }

  function renderScores() {
    $('score-a').textContent = state.teams[0].score;
    $('score-b').textContent = state.teams[1].score;
  }

  /* ── End Game ────────────────────────────── */
  function showEndGame() {
    pauseTimer();

    const [a, b] = state.teams;

    // Final scoreboard
    const sb = $('final-scoreboard');
    sb.innerHTML = `
      <div class="final-team" style="background:${a.color};color:${textColor(a.color)}">
        <div class="final-team-name">${a.name}</div>
        <div class="final-score">${a.score}</div>
      </div>
      <div class="final-vs">–</div>
      <div class="final-team" style="background:${b.color};color:${textColor(b.color)}">
        <div class="final-team-name">${b.name}</div>
        <div class="final-score">${b.score}</div>
      </div>
    `;

    // Stats columns
    const evA = state.events.filter(e => e.team === 0);
    const evB = state.events.filter(e => e.team === 1);

    function renderStatEvents(evts) {
      if (!evts.length) return `<div class="no-events">—</div>`;
      return evts.map(ev => `
        <div class="stats-event-item">
          <span class="s-icon">${eventIcon(ev)}</span>
          <span class="s-detail">${eventLabel(ev)}</span>
          <span class="s-time">${ev.timestamp}</span>
        </div>
      `).join('');
    }

    const goals = (t) => state.events.filter(e => e.team === t && e.type === 'goal').length;
    const yellows = (t) => state.events.filter(e => e.team === t && e.cardType === 'yellow').length;
    const reds = (t) => state.events.filter(e => e.team === t && e.cardType === 'red').length;

    $('stats-row').innerHTML = `
      <div class="stats-team-col">
        <div class="col-header" style="color:${a.color}">${a.name}</div>
        ${renderStatEvents(evA)}
        <div class="stats-event-item" style="margin-top:4px;opacity:0.6">
          <span class="s-icon">⚽</span><span class="s-detail">Goals</span><span class="s-time">${goals(0)}</span>
        </div>
        <div class="stats-event-item" style="opacity:0.6">
          <span class="s-icon">🟨</span><span class="s-detail">Yellows</span><span class="s-time">${yellows(0)}</span>
        </div>
        <div class="stats-event-item" style="opacity:0.6">
          <span class="s-icon">🟥</span><span class="s-detail">Reds</span><span class="s-time">${reds(0)}</span>
        </div>
      </div>
      <div class="stats-team-col">
        <div class="col-header" style="color:${b.color}">${b.name}</div>
        ${renderStatEvents(evB)}
        <div class="stats-event-item" style="margin-top:4px;opacity:0.6">
          <span class="s-icon">⚽</span><span class="s-detail">Goals</span><span class="s-time">${goals(1)}</span>
        </div>
        <div class="stats-event-item" style="opacity:0.6">
          <span class="s-icon">🟨</span><span class="s-detail">Yellows</span><span class="s-time">${yellows(1)}</span>
        </div>
        <div class="stats-event-item" style="opacity:0.6">
          <span class="s-icon">🟥</span><span class="s-detail">Reds</span><span class="s-time">${reds(1)}</span>
        </div>
      </div>
    `;

    endgameOverlay.classList.add('show');
  }

  btnNewGame.addEventListener('click', () => {
    endgameOverlay.classList.remove('show');
    gameScreen.classList.remove('active');
    setupScreen.style.display = '';
  });

  /* ── Service worker ─────────────────────── */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  /* ── Wake lock ───────────────────────────── */
  let wakeLock = null;
  btnPlay.addEventListener('click', async () => {
    try {
      if ('wakeLock' in navigator)
        wakeLock = await navigator.wakeLock.request('screen');
    } catch(_) {}
  });
</script>
</body>
</html>
