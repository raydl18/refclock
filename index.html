<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>RefClock</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b1326" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ═══════════════ SETUP SCREEN ═══════════════ -->
<div id="setup-screen">

  <!-- Top header: brand + auth -->
  <header id="setup-header">
    <div class="brand">
      <svg class="brand-icon icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-200q-100 0-170-70t-70-170q0-11 1-22t3-22q-5 2-12 3t-12 1q-42 0-71-29t-29-71q0-42 27.5-71t69.5-29q33 0 59.5 18.5T274-614q33-30 75.5-48t90.5-18h440v160H680v80q0 100-70 170t-170 70ZM180-540q17 0 28.5-11.5T220-580q0-17-11.5-28.5T180-620q-17 0-28.5 11.5T140-580q0 17 11.5 28.5T180-540Zm260 240q58 0 99-41t41-99q0-58-41-99t-99-41q-58 0-99 41t-41 99q0 58 41 99t99 41Zm0-60q33 0 56.5-23.5T520-440q0-33-23.5-56.5T440-520q-33 0-56.5 23.5T360-440q0 33 23.5 56.5T440-360Zm0-80Z"/></svg>
      <h1 class="brand-name">REFCLOCK</h1>
    </div>
    <div id="auth-bar">
      <div id="auth-signed-out">
        <button class="auth-btn auth-btn-link" id="btn-signin-show">Sign In</button>
      </div>
      <div id="auth-signed-in" style="display:none">
        <span id="auth-greeting"></span>
        <button class="auth-btn auth-btn-link" id="btn-signout">Sign out</button>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="setup-main">
    <div class="setup-row">

      <!-- Team A -->
      <div class="team-setup">
        <div class="team-color-swatch swatch-home" id="swatch-a" style="background:#1d4ed8;">
          <svg class="team-icon icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <input type="color" id="color-a" value="#1d4ed8" aria-label="Home team color" />
        </div>
        <div class="team-setup-body">
          <span class="team-setup-label">Home Team</span>
          <input class="team-name-input" id="name-a" type="text" placeholder="Enter Name" maxlength="16" value="Home" />
          <div class="team-setup-underline"></div>
        </div>
      </div>

      <!-- Team B -->
      <div class="team-setup">
        <div class="team-color-swatch swatch-away" id="swatch-b" style="background:#dc2626;">
          <svg class="team-icon icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg>
          <input type="color" id="color-b" value="#dc2626" aria-label="Away team color" />
        </div>
        <div class="team-setup-body">
          <span class="team-setup-label">Away Team</span>
          <input class="team-name-input" id="name-b" type="text" placeholder="Enter Name" maxlength="16" value="Away" />
          <div class="team-setup-underline"></div>
        </div>
      </div>

      <!-- Duration -->
      <div class="duration-setup">
        <span class="duration-label">Time Per Half</span>
        <div class="time-inputs">
          <div class="time-cell">
            <input type="number" id="input-min" value="45" min="1" max="99" aria-label="Minutes" />
          </div>
          <span class="time-sep">:</span>
          <div class="time-cell">
            <input type="number" id="input-sec" value="00" min="0" max="59" aria-label="Seconds" />
          </div>
        </div>
      </div>

    </div>

    <button id="btn-start-game">Kick Off</button>
  </main>

  <!-- Footer: links + copyright -->
  <footer id="setup-footer">
    <div class="footer-copyright">© 2026 REFCLOCK TELEMETRY</div>
  </footer>

  <!-- Bottom nav -->
  <nav id="setup-nav" aria-label="Primary">
    <button type="button" class="nav-btn nav-btn-active" aria-label="Setup" aria-current="page">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </button>
    <button type="button" class="nav-btn" id="btn-history" style="display:none" aria-label="Match history">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    </button>
    <button type="button" class="nav-btn" id="btn-help" aria-label="Settings and help">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </nav>
</div>

<!-- ═══════════════ HISTORY OVERLAY ══════════ -->
<div id="history-overlay">
  <div id="history-header">
    <span id="history-title">Match History</span>
    <button id="btn-history-close">✕</button>
  </div>
  <div id="history-list"></div>
</div>

<div id="game-detail-overlay">
  <div id="game-detail-header">
    <button id="btn-game-detail-back">← Back</button>
  </div>
  <div id="game-detail-content"></div>
</div>

<!-- ═══════════════ HELP OVERLAY ══════════ -->
 <div id="help-overlay">
  <div id="help-header">
    <span id="help-title">Help and Changelog</span>
    <button id="btn-help-close">✕</button>
  </div>
  <div id="help-list"></div>
 </div>

<!-- ═══════════════ GAME SCREEN ════════════════ -->
<div id="game-screen">

  <!-- LEFT TEAM -->
  <div class="team-panel" id="panel-a">
    <div class="team-label" id="label-a">Home</div>
    <div class="score" id="score-a">0</div>
    <div class="events-log" id="log-a"></div>
    <div class="team-actions">
      <button class="action-btn" id="goal-a">
        <span class="action-icon">⚽</span>Goal
      </button>
      <button class="action-btn" id="card-a">
        <span class="action-icon">🟨</span>Card
      </button>
    </div>
  </div>

  <!-- CENTER -->
  <div id="center-panel">
    <div class="app-title">RefClock</div>
    <div>
      <div id="clock">--:--</div>
      <div id="period-label">1st Half</div>
    </div>
    <div id="status-label">Ready</div>
    <div class="center-controls">
      <button class="ctrl-btn" id="btn-play">▶</button>
      <button class="ctrl-btn" id="btn-pause" disabled>⏸</button>
    </div>
    <div class="stoppage-controls">
      <button class="stoppage-btn" id="btn-retract">- Time</button>
      <input type="number" id="stoppage-secs" value="30" min="1" max="999" />
      <button class="stoppage-btn" id="btn-stoppage">+ Time</button>
    </div>
    <button id="btn-end-game">End Game</button>
    <div id="notes-details">
      <textarea id="notes-ingame" placeholder="Match notes…" rows="3"></textarea>
    </div>
  </div>

  <!-- RIGHT TEAM -->
  <div class="team-panel" id="panel-b">
    <div class="team-label" id="label-b">Away</div>
    <div class="score" id="score-b">0</div>
    <div class="events-log" id="log-b"></div>
    <div class="team-actions">
      <button class="action-btn" id="goal-b">
        <span class="action-icon">⚽</span>Goal
      </button>
      <button class="action-btn" id="card-b">
        <span class="action-icon">🟨</span>Card
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════ EVENT MODAL ════════════════ -->
<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title">Goal</h2>

    <div class="modal-field">
      <label>Player # <span style="color:#555">(optional)</span></label>
      <input type="number" id="modal-player" placeholder="—" min="1" max="99" />
    </div>

    <!-- Card type (shown only for card events) -->
    <div class="modal-field" id="card-type-field">
      <label>Card Type</label>
      <div class="card-type-row">
        <button class="card-type-btn yellow-card selected" id="btn-yellow">
          <span class="card-icon">🟨</span>Yellow
        </button>
        <button class="card-type-btn red-card" id="btn-red">
          <span class="card-icon">🟥</span>Red
        </button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="modal-btn" id="modal-cancel">Cancel</button>
      <button class="modal-btn" id="modal-confirm">Add</button>
    </div>
  </div>
</div>

<!-- ═══════════════ END GAME OVERLAY ══════════ -->
<div id="endgame-overlay">
  <h2>Final Whistle</h2>

  <div class="final-scoreboard" id="final-scoreboard"></div>

  <div class="stats-section">
    <h3>Match Events</h3>
    <div class="stats-row" id="stats-row"></div>
  </div>

  <div class="notes-endgame-section">
    <label class="notes-label">Notes</label>
    <textarea id="notes-endgame" placeholder="Match notes…" rows="3"></textarea>
  </div>

  <button id="btn-save-game">Save Game</button>
  <button id="btn-new-game">New Game</button>
</div>

<!-- ═══════════════ AUTH MODAL ═════════════ -->
<div id="auth-modal">
  <div id="auth-modal-box">
    <button id="btn-auth-close">✕</button>

    <div id="auth-tabs">
      <button class="auth-tab selected" id="tab-signin">Sign In</button>
      <button class="auth-tab" id="tab-signup">Sign Up</button>
    </div>

    <!-- Sign in -->
    <div id="panel-signin">
      <input type="email" id="si-email" placeholder="Email" autocomplete="email" />
      <input type="password" id="si-password" placeholder="Password" autocomplete="current-password" />
      <p class="auth-error" id="si-error" style="display:none"></p>
      <button class="auth-submit-btn" id="btn-do-signin">Sign In</button>
      <button class="auth-link-btn" id="btn-show-reset">Forgot password?</button>
    </div>

    <!-- Sign up -->
    <div id="panel-signup" style="display:none">
      <input type="text" id="su-name" placeholder="Display name" autocomplete="nickname" maxlength="32" />
      <input type="email" id="su-email" placeholder="Email" autocomplete="email" />
      <input type="password" id="su-password" placeholder="Password" autocomplete="new-password" />
      <input type="password" id="su-confirm" placeholder="Confirm password" autocomplete="new-password" />
      <p class="auth-error" id="su-error" style="display:none"></p>
      <button class="auth-submit-btn" id="btn-do-signup">Create Account</button>
    </div>

    <!-- Reset password -->
    <div id="panel-reset" style="display:none">
      <p class="auth-reset-info">Enter your email and we'll send a password reset link.</p>
      <input type="email" id="reset-email" placeholder="Email" autocomplete="email" />
      <p id="reset-msg" style="display:none"></p>
      <button class="auth-submit-btn" id="btn-do-reset">Send Reset Email</button>
      <button class="auth-link-btn" id="btn-reset-back">Back to Sign In</button>
    </div>
  </div>
</div>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.js"
  integrity="sha384-m/8UHFJHeU6nrCKP2hBnAseuvAKUmLF+8e5bWos5CJL023vuxX7kiVL5t8yjsJhV"
  crossorigin="anonymous"></script>
<script src="supabase.js"></script>
<script src="version.js"></script>
<script src="app.js" defer></script>
</body>
</html>
